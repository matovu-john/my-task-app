<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Page content goes here -->
  <h1>Hello World</h1>

  <form class='form'>

    <div class='field'>
      <label>Name</label>
      <input name='name' data-min-length='3' data-max-length='36' data-forbidden-char='*'>
      <p></p>
    </div>

    <div class='field'>
      <label>Usernane</label>
      <input name='username' data-min-length='3' data-max-length='16' data-allowed-char='a-zA-Z0-9_'>
      <p></p>
    </div>

    <div class='field'>
      <label>Phone</label>
      <input name='phone' data-min-length='10' data-max-length='10' data-allowed-char='0-9'>
      <p></p>
    </div>

    <div class='field'>
      <label>Password</label>
      <input type='password' name='password1' data-min-length='8' data-max-length='36' data-forbidden-char=''>
      <p></p>
    </div>

    <div class='field'>
      <label>Confirm password</label>
      <input type='password' name='password2' data-match='password1' data-min-length='8' data-max-length='36' data-forbidden-char=''>
      <p></p>
    </div>

    <button class='signup-btn' type='submit'>SignUp</button>
  </form>

  <script type="module" src="js/main.js"></script>
</body>
</html>
